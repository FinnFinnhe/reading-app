<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拯救書庫 Project</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #ebe8e0; 
            background-image: url('base3.png'); /* 妳的 Banner，寬1200*高400 */
            background-size: 100% auto; 
            background-repeat: no-repeat;
            background-position: top center;
            background-attachment: scroll;
        }
        .glass-card {
            background-color: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        body::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen text-stone-800 p-4">

    <div id="app" class="max-w-md mx-auto flex flex-col pt-[60px] pb-12">
        
        <header class="mb-3">
            <div class="flex justify-between items-center bg-white/40 p-1 rounded-xl border border-stone-200/40 backdrop-blur-sm">
                <button @click="currentUser = 'S'" 
                        :class="currentUser === 'S' ? 'bg-slate-500 text-white font-black' : 'text-stone-400'"
                        class="flex-1 py-1.5 rounded-lg transition-all text-center text-xs">S</button>
                <button @click="currentUser = 'F'" 
                        :class="currentUser === 'F' ? 'bg-[#5c4033] text-white font-black' : 'text-stone-400'"
                        class="flex-1 py-1.5 rounded-lg transition-all text-center text-xs">F</button>
            </div>
        </header>

        <main class="flex-1">
            <div class="glass-card rounded-[1rem] shadow-xl border border-white/40 p-4 mb-3 text-center relative">
                <p class="text-[10px] font-black text-stone-400 uppercase tracking-widest mb-1">可購書總額度</p>
                <div class="text-7xl font-black mb-3" :class="currentUser === 'S' ? 'text-slate-500' : 'text-[#5c4033]'">
                    {{ Math.floor(currentData.points / 2) }}
                </div>
                <p class="text-[11px] text-stone-400 font-bold tracking-tight">累積點數：{{ currentData.points }}</p>
            </div>

            <div class="space-y-1.5">
                <button @click="showForm = true" :disabled="loading"
                        class="w-full text-white font-bold p-3 rounded-xl shadow-md active:scale-95 disabled:bg-stone-300 transition-all text-xs"
                        :class="currentUser === 'S' ? 'bg-slate-600' : 'bg-[#4e342e]'">
                    <span v-if="!loading">＋ {{ currentUser }} 讀完新書了</span>
                    <span v-else class="animate-pulse">同步雲端中...</span>
                </button>

                <button @click="openRedeemModal" :disabled="currentData.points < 2 || loading"
                        class="w-full bg-white/70 text-stone-600 border border-stone-200 font-bold p-2.5 rounded-xl disabled:opacity-30 transition-all text-[9px] tracking-wider backdrop-blur-sm">
                    🛒 兌換購書額度 (每 2 點/本)
                </button>
            </div>

            <div class="mt-5">
                <h3 class="text-[9px] font-black text-stone-400 mb-2 tracking-widest uppercase text-center italic">Recent History</h3>
                <div class="space-y-1.5 text-[10px]">
                    <div v-for="(item, index) in [...currentData.history].reverse().slice(0, 2)" :key="index" 
                         class="bg-white/80 p-2 rounded-lg shadow-sm border-l-4"
                         :class="currentUser === 'S' ? 'border-slate-500' : 'border-[#5c4033]'">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-bold text-stone-700 leading-tight">{{ item.title }}</div>
                                <div class="text-[9px] text-stone-400 mt-0.5">
                                    <span>{{ item.publisher ? item.publisher : '兌換紀錄' }}</span>
                                </div>
                            </div>
                            <span class="text-[8px] font-bold px-1.5 py-0.5 bg-white/60 rounded text-stone-500">{{ item.action }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        </div>

    <script>
        const { createApp } = Vue;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwhK6C80FggOvsiN9laA96n4jb1A8m0mbRWywZU0urIiR7oKL4NGUwRsW73ciG64E49/exec';

        createApp({
            data() {
                return {
                    currentUser: 'F',
                    loading: false,
                    showForm: false,
                    showRedeemModal: false,
                    redeemCount: 1,
                    redeemBookTitle: '',
                    form: { title: '', author: '', publisher: '' },
                    db: { S: { points: 0, history: [] }, F: { points: 0, history: [] } }
                }
            },
            computed: { currentData() { return this.db[this.currentUser]; } },
            methods: {
                async syncToCloud(payload) {
                    this.loading = true;
                    try {
                        await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                        return true;
                    } catch (e) { return false; } finally { this.loading = false; }
                },
                async submitBook() {
                    if (!this.form.title.trim()) return alert('請輸入書名');
                    const data = { ...this.form, action: '讀書加點', user: this.currentUser, date: new Date().toLocaleDateString('zh-TW') };
                    await this.syncToCloud(data);
                    this.currentData.points += 1;
                    this.currentData.history.push(data);
                    // 🌟 強迫更新緩存名稱
                    localStorage.setItem('sf_reading_project_final_force', JSON.stringify(this.db));
                    this.form = { title: '', author: '', publisher: '' };
                    this.showForm = false;
                },
                openRedeemModal() {
                    this.redeemCount = 1;
                    this.redeemBookTitle = '';
                    this.showRedeemModal = true;
                },
                async handleRedeem() {
                    const totalCost = this.redeemCount * 2;
                    if (this.currentData.points < totalCost) return alert('點數不足');
                    
                    this.showRedeemModal = false;
                    const bookNote = this.redeemBookTitle.trim() ? ` 📘 預計購買：${this.redeemBookTitle.trim()}` : '';
                    
                    const data = { 
                        title: `兌換額度 (${this.redeemCount}本)${bookNote}`, 
                        action: '扣點', 
                        user: this.currentUser, 
                        date: new Date().toLocaleDateString('zh-TW'),
                        publisher: `消耗 ${totalCost} 點`
                    };
                    
                    await this.syncToCloud(data);
                    this.currentData.points -= totalCost;
                    this.currentData.history.push(data);
                    // 🌟 強迫更新緩存名稱
                    localStorage.setItem('sf_reading_project_final_force', JSON.stringify(this.db));
                }
            },
            mounted() {
                // 🌟 強迫更新緩存讀取邏輯
                const saved = localStorage.getItem('sf_reading_project_final_force') || 
                              localStorage.getItem('sf_reading_project_final') || 
                              localStorage.getItem('sf_reading_v2');
                if (saved) this.db = JSON.parse(saved);
            }
        }).mount('#app')
    </script>
</body>
</html>
